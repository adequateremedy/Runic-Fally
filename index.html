<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Class 1: Runic-Fally</title>
    <link rel="stylesheet" href="css/runic-fally.css">
</head>
<body>

    <!-- AUTH SCREENS -->
    <div id="loginScreen">
        <h1>Eidolon School</h1>
        <p class="subtitle">Class 1: Runic-Fally (Ages 2-3)</p>
        <button id="googleSignInButton">Sign in with Google</button>
    </div>

    <div id="loadingScreen" class="hidden">
        <p>Syncing Desk with Google Drive...</p>
        <p id="loadingMsg"></p>
        <div id="progressBarContainer" class="hidden">
            <div id="progressBarFill"></div>
        </div>
        <div id="loadingPercent" class="hidden">0%</div>
    </div>

    <!-- MAIN GAME UI -->
    <div id="gameUI" class="hidden">
        <div class="header-bar">
            <div class="stat-box">
                <div class="stat-label">Round</div>
                <div class="stat-value" id="uiRound">1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Round Score</div>
                <div class="stat-value" id="uiScore">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Time</div>
                <div class="stat-value" id="uiTime">60</div>
            </div>
        </div>

        <div id="inventoryBar">
            <button id="bombBtn" disabled>
                <img src="assets/Star/Star-Symbol.png" alt="Star"> 
                Place Star (<span id="uiStars">0</span>)
            </button>
            <div id="totalPointsDisplay" style="font-size: 0.9rem; color: #e3d2b9; font-weight: bold;">
                Total Points: <span id="uiTotalPoints">0</span>
            </div>
        </div>

        <div id="canvasContainer">
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

    <!-- TALLY MODAL -->
    <div id="tallyModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="tallyTitle">Time's Up!</h2>
            
            <div class="grade-section">
                <p>Round <span id="tallyRoundNumber"></span> Score: <span id="tallyScore">0</span></p>
                <h3 style="margin: 10px 0 5px 0;">Current Grade: <span id="tallyGrade">F</span></h3>
                <p style="font-size: 0.85rem; opacity: 0.8; margin-top: 0;">Class Progress: <span id="tallyPercent">0</span>%</p>
            </div>
            
            <div class="cards-grid" id="tallyCards"></div>
            
            <div class="modal-buttons">
                <button id="nextRoundBtn">Next Round</button>
                <button id="returnHubBtn">Go Back to Hub</button>
                <button id="restartClassBtn" class="danger-btn">Restart Class</button>
            </div>
        </div>
    </div>

    <!-- CLASS COMPLETE MODAL -->
    <div id="completeModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h1 style="color:#e3d2b9;">Class Completed!</h1>
            <p>You have mastered Runic-Fally with an A+ Grade!</p>
            <p style="color:#7F522B; font-weight:bold;">100 EXP Awarded</p>
            <button id="completeReturnHubBtn" style="width: 100%; margin-top: 20px;">Return to Hub</button>
        </div>
    </div>

    <script type="module" src="js/runic-fally.js"></script>
</body>
</html>
